<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Clarity Questionnaire | Home Muse</title>
<meta name="description" content="Before our session: a few questions about you, your space and your vision.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FBF8F1">
<link rel="icon" href="https://www.homemuse.fr/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE warm, hushed, personal: the client has just booked, this is the first step of working together
   IDEA the Home Muse archetype quiz card, one chapter per page, like a printed interiors questionnaire
   PICTURE the card itself, with an arch framing the welcome and a chapter number per section
   COLOUR Home Muse cream ground, deep green ink, brass gold accent
   TYPE Cormorant Garamond display + Jost text, as on homemuse.fr
   LAYOUT one centred column up to 680px; wordmark and FR/EN switch on top; same order on phone */
:root{color-scheme:light dark;--bg:light-dark(#F3EDE3,#1b1a17);--card:light-dark(#FBF8F1,#25231f);--ink:light-dark(#2b3328,#efe9df);--soft:light-dark(#5f6656,#b9b2a6);--gold:light-dark(#9c7a45,#d3ad6d);--line:light-dark(#e2d8c8,#3a362f);--blush:light-dark(#F2DFD3,#3b2f2a)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:300 17px/1.6 Jost,"Helvetica Neue",Arial,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
header{display:flex;justify-content:space-between;align-items:center;padding:20px max(5vw,16px);max-width:1240px;margin:0 auto}
.brand{display:block;width:110px;height:auto}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;color:var(--soft);font:500 14px Jost,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:36px}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
main{padding:8px max(5vw,16px) 64px}
.card{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:clamp(24px,5vw,56px)}
.center{text-align:center}
.logo{display:block;width:min(260px,64%);height:auto;margin:0 auto 26px}
.arch{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:50% 50% 3px 3px/40% 40% 3px 3px;margin:0 0 28px;background:var(--blush)}
.intro h1{font-size:clamp(38px,6vw,52px)}
.lede{color:var(--soft);max-width:31em;margin:16px auto 22px}
.facts{display:flex;justify-content:center;gap:10px 26px;flex-wrap:wrap;color:var(--soft);font-size:15px;margin:0 0 30px;padding:0;list-style:none}
.facts li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:0 9px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 28px;border:0;border-radius:2px;background:var(--gold);color:#fff;font:500 16px Jost,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.lang button:focus-visible,.back:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);margin-bottom:10px}
.bar{height:2px;background:var(--line);margin-bottom:32px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s ease}
.chap{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;color:var(--gold);font-size:22px;margin:0 0 4px}
.sec h2{font-size:clamp(30px,4.6vw,40px);margin-bottom:8px}
.sec .sub{color:var(--soft);margin:0 0 28px}
.field{margin:0 0 26px}
.field>label,.field>.lab{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:500;line-height:1.25;color:var(--ink);margin-bottom:4px}
.field .eg{display:block;font-size:14px;color:var(--soft);margin-bottom:10px}
.req{color:var(--gold)}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea{width:100%;margin-top:6px;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:400 16px/1.5 Jost,sans-serif}
textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.row2 label{font-size:14px;color:var(--soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:300 15px/1.3 Jost,sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed=true]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent);font-weight:400}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.scale .opt{border-radius:2px;padding:10px 4px;text-align:center}
.scale-l{display:flex;justify-content:space-between;font-size:13px;color:var(--soft);margin-top:6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding-top:22px;border-top:1px solid var(--line)}
.back{background:none;border:0;color:var(--soft);font:400 15px Jost,sans-serif;cursor:pointer;padding:8px 0;min-height:44px}
.err{color:#b3412e;font-size:14px;margin:0 0 12px}
.saved{font-size:13px;color:var(--soft)}
.review dl{margin:0 0 24px;display:grid;gap:4px}
.review h3{font-size:24px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.review h3 button{background:none;border:0;color:var(--gold);font:400 14px Jost,sans-serif;cursor:pointer;min-height:36px}
.review dt{font-size:14px;color:var(--soft);margin-top:8px}
.review dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.review dd.empty{color:var(--soft);font-style:italic}
.thanks h1{font-size:clamp(36px,6vw,48px);margin-bottom:14px}
.thanks p{max-width:30em;margin:0 auto 14px}
.sig{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:26px;color:var(--gold);margin-top:18px!important}
.note{background:var(--blush);padding:18px 20px;border-radius:2px;font-size:15px;text-align:left;margin-top:24px!important}
.foot{text-align:center;color:var(--soft);font-size:13px;margin-top:20px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
:root[data-theme=dark] .logo,:root[data-theme=dark] .brand{background:#FBF8F1;padding:10px 14px;border-radius:4px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .logo,:root:not([data-theme=light]) .brand{background:#FBF8F1;padding:10px 14px;border-radius:4px}}
@media(max-width:600px){body{font-size:16px}.row2{grid-template-columns:minmax(0,1fr)}.field>label,.field>.lab{font-size:20px}.scale .opt{font-size:14px}}
</style>
</head>
<body>
<header>
  <img class="brand" id="hlogo" alt="Home Muse" width="120" height="78">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-l="en">EN</button>
    <button type="button" data-l="fr">FR</button>
  </div>
</header>
<main><div class="card" id="app" aria-live="polite"></div>
<p class="foot" id="foot"></p></main>

const T = {
 en:{kicker:'Before our session',title:'Your home has a story. Let’s hear it.',lede:'Thank you for booking with Home Muse. These questions help me understand your needs, your vision and your challenges, so we make the most of our time together. Take a quiet moment and answer as openly as you can.',facts:['10 short chapters','About 15 minutes','Saved as you go'],start:'Let’s begin',resume:'Continue where I left off',restart:'Start again',of:(a,b)=>`Chapter ${a} of ${b}`,next:'Next',back:'Back',review:'Review my answers',saved:'Saved on this device',req:'Please add your name and a valid email.',rtitle:'Your answers',rsub:'Have a last look. You can edit any chapter.',edit:'Edit',empty:'Not answered',send:'Send to Lou',sending:'Sending…',fail:'That didn’t go through. Please check your connection and try again, or email contact@homemuse.fr.',ttitle:'Thank you. Your home already has a story to tell.',t1:'Your answers will guide me in creating a space that truly resonates with you, and in making your project a success from start to finish.',t2:'I can’t wait to help you bring your vision to life.',photos:'Have photos of your space? Reply to my booking email or send them to contact@homemuse.fr. Before photos help enormously.',foot:'Your answers come only to me, are used only to prepare our work together, and are never shared.',low:'1',high:'5'},
 fr:{kicker:'Avant notre séance',title:'Votre maison a une histoire. Racontez-la moi.',lede:'Merci d’avoir réservé avec Home Muse. Ces questions m’aident à comprendre vos besoins, votre vision et vos défis, pour que nous profitions au mieux de notre temps ensemble. Prenez un moment au calme et répondez aussi librement que possible.',facts:['10 chapitres courts','Environ 15 minutes','Enregistré au fur et à mesure'],start:'Commencer',resume:'Reprendre où j’en étais',restart:'Recommencer',of:(a,b)=>`Chapitre ${a} sur ${b}`,next:'Suivant',back:'Retour',review:'Relire mes réponses',saved:'Enregistré sur cet appareil',req:'Merci d’indiquer votre nom et un e-mail valide.',rtitle:'Vos réponses',rsub:'Un dernier coup d’œil. Vous pouvez modifier chaque chapitre.',edit:'Modifier',empty:'Sans réponse',send:'Envoyer à Lou',sending:'Envoi…',fail:'L’envoi n’a pas abouti. Vérifiez votre connexion et réessayez, ou écrivez à contact@homemuse.fr.',ttitle:'Merci. Votre maison a déjà une histoire à raconter.',t1:'Vos réponses vont me guider pour créer un lieu qui vous ressemble vraiment, et pour faire de votre projet une réussite du début à la fin.',t2:'J’ai hâte de vous aider à donner vie à votre vision.',photos:'Vous avez des photos de votre lieu ? Répondez à mon e-mail de réservation ou envoyez-les à contact@homemuse.fr. Les photos « avant » m’aident énormément.',foot:'Vos réponses ne sont lues que par moi, servent uniquement à préparer notre travail ensemble et ne sont jamais partagées.',low:'1',high:'5'}
};

let lang = (navigator.language||'').toLowerCase().startsWith('fr') ? 'fr' : 'en';
let A = {}, view = 'intro', step = 0, hasDraft = false;
try{const d=JSON.parse(localStorage.getItem(STORE)||'null'); if(d&&d.A){A=d.A; if(d.lang) lang=d.lang; hasDraft=Object.keys(A).length>0}}catch(e){}
if(STUDIO){ if(!hasDraft && /^(en|fr)$/.test(QS.get('lang')||'')) lang=QS.get('lang'); ['name','email','phone'].forEach(k=>{ if(!A[k] && QS.get(k)) A[k]=QS.get(k); }); }
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify({A,lang}))}catch(e){} if(STUDIO) toStudio({kind:'clarity-draft', answers:A, lang, review:review()});};
function review(){return S.map(s=>({s:s.en,f:s.f.map(f=>({q:f.en,a:fmt(f,'en')}))}));}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
const L=(o,k)=>o[k+(lang==='fr'?'fr':'en')]??o[lang];
const optLabel=(f,i)=>f.o[i][lang==='fr'?1:0];

function fieldHTML(f){
  const t=T[lang], lab=esc(f[lang])+(f.r?' <span class="req">*</span>':''), eg=f.egen?`<span class="eg">${esc(L(f,'eg'))}</span>`:'';
  const v=A[f.id];
  if(f.k==='c'){
    const sel=Array.isArray(v)?v:(v==null?[]:[v]);
    return `<div class="field" role="group" aria-labelledby="lb-${f.id}"><span class="lab" id="lb-${f.id}">${lab}</span>${eg}<div class="opts">${f.o.map((o,i)=>`<button type="button" class="opt" data-f="${f.id}" data-i="${i}" aria-pressed="${sel.includes(i)}">${esc(optLabel(f,i))}</button>`).join('')}</div></div>`;
  }
  if(f.k==='s'){
    return `<div class="field" role="group" aria-labelledby="lb-${f.id}"><span class="lab" id="lb-${f.id}">${lab}</span><div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" class="opt" data-f="${f.id}" data-n="${n}" aria-pressed="${v===n}">${n}</button>`).join('')}</div><div class="scale-l"><span>${esc(f.lo[lang==='fr'?1:0])}</span><span>${esc(f.hi[lang==='fr'?1:0])}</span></div></div>`;
  }
  const typ={t:'text',e:'email',p:'tel'}[f.k], ac={name:'name',email:'email',phone:'tel'}[f.id]||'off';
  const val=esc(v||'');
  const ctl=f.k==='l'?`<textarea id="f-${f.id}" data-f="${f.id}">${val}</textarea>`:`<input type="${typ}" id="f-${f.id}" data-f="${f.id}" value="${val}" autocomplete="${ac}"${f.r?' required':''}>`;
  return `<div class="field"><label for="f-${f.id}">${lab}</label>${eg}${ctl}</div>`;
}

function render(){
  const t=T[lang];
  document.documentElement.lang = lang==='fr'?'fr':'en-GB';
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===lang));
  const hl=document.getElementById('hlogo'); if(!hl.src) hl.src=LOGO; hl.style.visibility = view==='intro'?'hidden':'visible';
  document.getElementById('foot').textContent=t.foot;
  if(view==='intro'){
    app.innerHTML=`<div class="intro center fade"><img class="logo" src="${LOGO}" alt="Home Muse" width="720" height="465">
      <img class="arch" src="${HERO}" alt="" onerror="this.remove()">
      <p class="chap">${esc(t.kicker)}</p><h1>${esc(t.title)}</h1><p class="lede">${esc(t.lede)}</p>
      <ul class="facts">${t.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <button class="btn" id="go">${esc(hasDraft?t.resume:t.start)}</button>
      ${hasDraft?`<p><button class="back" id="reset">${esc(t.restart)}</button></p>`:''}</div>`;
    app.querySelector('#go').onclick=()=>{view='sec';render();};
    const r=app.querySelector('#reset'); if(r) r.onclick=()=>{A={};hasDraft=false;save();step=0;view='sec';render();};
    return;
  }
  if(view==='sec'){
    const s=S[step], last=step===S.length-1;
    app.innerHTML=`<div class="sec fade"><div class="meta"><span>${esc(t.of(step+1,S.length))}</span><span class="saved">${esc(t.saved)}</span></div>
      <div class="bar"><i style="width:${(step+1)/S.length*100}%"></i></div>
      <p class="chap">${step+1}</p><h2>${esc(s[lang])}</h2><p class="sub">${esc(L(s,'s'))}</p>
      ${s.f.map(fieldHTML).join('')}
      <p class="err" id="err" hidden></p>
      <div class="nav"><button class="back" id="prev">${esc(t.back)}</button><button class="btn" id="nx">${esc(last?t.review:t.next)}</button></div></div>`;
    app.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',()=>{A[el.dataset.f]=el.value;save();}));
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const f=s.f.find(x=>x.id===b.dataset.f);
      if(f.k==='s'){A[f.id]=+b.dataset.n;}
      else if(f.m){const cur=Array.isArray(A[f.id])?A[f.id]:[];const i=+b.dataset.i;A[f.id]=cur.includes(i)?cur.filter(x=>x!==i):[...cur,i];}
      else{const i=+b.dataset.i;A[f.id]=A[f.id]===i?null:i;}
      save();
      b.parentNode.querySelectorAll('.opt').forEach(o=>{const on=f.k==='s'?A[f.id]===+o.dataset.n:f.m?A[f.id].includes(+o.dataset.i):A[f.id]===+o.dataset.i;o.setAttribute('aria-pressed',on);});
    });
    app.querySelector('#prev').onclick=()=>{if(step===0){view='intro';}else step--;render();window.scrollTo(0,0);};
    app.querySelector('#nx').onclick=()=>{
      if(step===0&&!valid()){const e=app.querySelector('#err');e.textContent=t.req;e.hidden=false;return;}
      if(last) view='review'; else step++;
      render();window.scrollTo(0,0);
    };
    return;
  }
  if(view==='review'){
    app.innerHTML=`<div class="review fade"><h2 style="font-size:clamp(32px,5vw,42px)">${esc(t.rtitle)}</h2><p class="sub" style="color:var(--soft)">${esc(t.rsub)}</p>
      ${S.map((s,i)=>`<h3>${i+1}. ${esc(s[lang])} <button data-go="${i}">${esc(t.edit)}</button></h3><dl>${s.f.map(f=>{const a=fmt(f,lang);return `<dt>${esc(f[lang])}</dt><dd class="${a?'':'empty'}">${esc(a||t.empty)}</dd>`}).join('')}</dl>`).join('')}
      <p class="err" id="err" hidden></p>
      <div class="nav"><button class="back" id="prev">${esc(t.back)}</button><button class="btn" id="send">${esc(t.send)}</button></div></div>`;
    app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=+b.dataset.go;view='sec';render();window.scrollTo(0,0);});
    app.querySelector('#prev').onclick=()=>{step=S.length-1;view='sec';render();};
    app.querySelector('#send').onclick=send;
    return;
  }
  if(view==='thanks'){
    app.innerHTML=`<div class="thanks center fade"><img class="logo" src="${LOGO}" alt="Home Muse" width="720" height="465" style="width:min(180px,50%)">
      <h1>${esc(t.ttitle)}</h1><p>${esc(t.t1)}</p><p>${esc(t.t2)}</p><p class="sig">Lou</p><p class="note">${esc(t.photos)}</p></div>`;
  }
}

function valid(){return (A.name||'').trim() && /^\S+@\S+\.\S+$/.test((A.email||'').trim());}
function fmt(f,lg){
  const v=A[f.id], k=lg==='fr'?1:0;
  if(f.k==='c'){const a=Array.isArray(v)?v:(v==null?[]:[v]);return a.map(i=>f.o[i][k]).join(', ');}
  if(f.k==='s'){return v?`${v} / 5`:'';}
  return (v||'').trim();
}

function toSheet(){
  if(!SHEET_HOOK) return;
  const row=new URLSearchParams();
  row.append('Submitted',new Date().toLocaleString('en-GB',{timeZone:'Europe/Paris'}));
  row.append('Language',lang==='fr'?'Français':'English');
  S.forEach(s=>s.f.forEach(f=>row.append(COLS[f.id]||f.en, fmt(f,'en')||'')));
  try{fetch(SHEET_HOOK,{method:'POST',mode:'no-cors',body:row});}catch(e){}
}

function send(){
  const t=T[lang], btn=app.querySelector('#send'), err=app.querySelector('#err');
  if(!valid()){step=0;view='sec';render();return;}
  const data={'Language':lang==='fr'?'Français':'English'};
  S.forEach((s,i)=>s.f.forEach(f=>{data[`${i+1}. ${s.en} · ${f.en}`]=fmt(f,'en')||'—';}));
  const offer=fmt(S[0].f[3],'en');
  data._subject=`Clarity questionnaire · ${A.name.trim()}${offer?' · '+offer:''} (${lang.toUpperCase()})`;
  data._replyto=A.email.trim(); data._cc=A.email.trim(); data._template='table'; data._captcha='false';
  if(STUDIO){ toStudio({kind:'clarity', answers:A, lang, review:review(), email:data}); view='thanks'; render(); window.scrollTo(0,0); return; }
  btn.disabled=true; btn.textContent=t.sending; err.hidden=true;
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)})
    .then(r=>r.json().then(b=>{if(!r.ok||String(b.success)==='false')throw 0;}))
    .then(()=>{toSheet();try{localStorage.removeItem(STORE)}catch(e){} view='thanks';render();window.scrollTo(0,0);})
    .catch(()=>{btn.disabled=false;btn.textContent=t.send;err.textContent=t.fail;err.hidden=false;});
}

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();render();});
render();
}
</script>
</body>
</html>
